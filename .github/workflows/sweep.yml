# The weekly sweep: everything the per-push gate is too slow to do.
#
# `site.yml` runs on every push, so it samples two monument pages and the three
# root pages. That is the right shape for a push — it finishes in minutes — but it
# leaves twenty-one pages unvisited, and this repository has already had a week
# where the gate looked green because the browser job was skipped by a condition.
#
# This job visits all of them, at a desktop and a phone viewport, once a week, and
# keeps the logs as artifacts. It does not block anything: it reports.

name: weekly sweep

on:
  schedule:
    - cron: '0 3 * * 1'        # Mondays, 03:00 UTC — 08:30 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: every page, two viewports
    runs-on: ubuntu-latest
    timeout-minutes: 240        # a11y x2 viewports + contrast + measure is ~2 h
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build_extras dates the sitemap from git history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium
      - name: Resolve the Chromium path
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              open('chrome_path.txt', 'w').write(p.chromium.executable_path)
          EOF
          echo "CHROME_PATH=$(cat chrome_path.txt)" >> "$GITHUB_ENV"

      # the static checks first: they take seconds, and a stale page makes the
      # rest meaningless
      - name: Regenerate and prove the pages are current
        run: |
          python3 tools/build_site.py
          python3 tools/build_taj.py
          python3 tools/build_extras.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated pages differ from the committed ones."
            git --no-pager diff --stat
            exit 1
          fi
      - name: Links, data, tints, framing
        run: |
          python3 tools/linkcheck.py
          python3 tools/audit_data.py --strict
          python3 tools/tintcheck.py --ci
          python3 tools/framecheck.py

      # the slow part: every page, at a desktop and a phone viewport.
      # --restart because the logs are committed: a resuming run would skip every
      # page and report success without having looked at one.
      - name: Accessibility, every page, 380 wide
        run: python3 tools/check_a11y_all.py --size 380x430 --budget 4000 --restart
      - name: Accessibility, every page, 390x844
        run: python3 tools/check_a11y_all.py --size 390x844 --budget 4000 --restart
      - name: Root pages
        run: |
          python3 tools/check_a11y.py --root
          python3 tools/check_a11y.py --root --width 390 --height 844

      # contrast: the check that found the top bar on bare sky. Slow here (each
      # page boots a WebGL scene), which is exactly why it belongs in the sweep
      # rather than on every push.
      - name: Contrast, every page
        run: |
          python3 tools/contrastcheck.py --only index.html credits.html
          # the Taj is skipped: it takes minutes to load and the tool's own default
          # leaves it out for the same reason
          for f in monuments/*.html; do
            case "$f" in *taj-mahal*) echo "— $f (skipped, slow)"; continue;; esac
            echo "— $f"
            python3 tools/contrastcheck.py --only "$f" || true
          done

      - name: Measure the built geometry
        run: |
          python3 tools/measure.py --all --unit 1
          python3 tools/measure.py taj-mahal --unit 3.353

      # one image of all 24 models, so the week's visual state is in the artifact
      # rather than only in someone's memory of what it looked like
      - name: Contact sheet
        run: python3 tools/contact_sheet.py --size 380x300

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-logs
          path: |
            shots/a11y-all-*.log
            shots/sheet.png
          if-no-files-found: warn
          retention-days: 30
