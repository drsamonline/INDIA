name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: rebuild pages and check links
    runs-on: ubuntu-latest
    steps:
      # full history: build_extras dates the sitemap from the last commit that
      # touched data/monuments.json, and a shallow clone reports HEAD instead
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install --quiet pillow
      - name: Regenerate pages from data/monuments.json
        run: python3 tools/build_site.py
      - name: Regenerate the Taj Mahal page
        run: python3 tools/build_taj.py
      - name: Regenerate robots, sitemap and 404
        run: python3 tools/build_extras.py
      - name: Fail if the generated pages are stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated pages differ from the committed ones. Run tools/build_site.py and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
      - name: Check internal links and assets
        run: python3 tools/linkcheck.py
      - name: Audit the data file
        run: python3 tools/audit_data.py --strict
      - name: Every page's home view frames its building
        run: python3 tools/framecheck.py
      - name: No material tinted off a textured base
        run: python3 tools/tintcheck.py --ci

  render:
    name: render a page in a headless browser
    # This job held the accessibility gate, the render check and the keyboard
    # checks, and it only ran on pull requests — which this repository does not
    # open. Every push to main therefore skipped all three, and the workflow
    # looked green in seventeen seconds because it had only done the static
    # checks. It runs on push now; that is the only way the gate is a gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium
      - name: Resolve the Chromium path
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              open('chrome_path.txt', 'w').write(p.chromium.executable_path)
          EOF
          echo "CHROME_PATH=$(cat chrome_path.txt)" >> "$GITHUB_ENV"
      - name: Boot two pages and check for console errors
        run: python3 tools/check_all.py --only qutub-minar golden-temple --out shots
      - name: Check the accessibility contract
        run: python3 tools/check_a11y.py --only qutub-minar
      - name: Check the landing, credits and 404 pages
        run: python3 tools/check_a11y.py --root
      # a sample on every push (~40 s a page); the weekly sweep runs all 24
      - name: Drawers carry their level and report link
        run: python3 tools/check_drawer.py qutub-minar taj-mahal lotus-temple
      - name: Exercise the documented keyboard shortcuts
        run: python3 tools/check_ui.py --only qutub-minar
