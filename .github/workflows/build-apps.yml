# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# The whole pipeline lives in the public app-builder kit, so a fix there reaches
# every app at once. Do not inline it: a hand-copied version once kept
# `if: always()` on the release job, so a FAILED build destroyed the release.
#
# Every push to main: build the portable EXE and the APK -> publish the rolling
# `app-latest` release -> deploy the demo to Pages. All three come from the same
# commit, so the live demo and the released build can never disagree.
# Pull requests build (and are therefore checked) but never release or deploy.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    # PINNED, NOT @main. A caller that names a moving branch has to have GitHub
    # resolve that branch when the run starts, and when that resolution does not
    # happen the run dies at startup with ZERO jobs, no log and no check run --
    # which is exactly what this repo did on 2026-11-24 (05:51Z and 05:58Z). The
    # content is not the difference: build.yml at this sha is byte-identical to
    # main today. Every app repo already pins the sha, and every one of them is
    # green; the four still on @main are the four with startup_failures.
    uses: drsamonline/app-builder/.github/workflows/build.yml@85949b5b7ef6a47a40731cc01e8c2cd65ceeda4c
    with:
      app_name: INDIA
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      id-token: write
